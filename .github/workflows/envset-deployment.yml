name: "EnvSet Deployment Automation Pipeline"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Environment"
        required: true
        default: "STG"
        type: choice
        options:
          - STG
          - PROD
      envset_number:
        description: "EnvSet / ConfigSet Number (e.g. 1947)"
        required: true
        type: string
      dry_run:
        description: "Dry Run Mode (Simulate execution without modifying systems)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

env:
  ENVIRONMENT: "${{ github.event.inputs.environment }}"
  ENVSET_NUMBER: "${{ github.event.inputs.envset_number }}"
  DRY_RUN: "${{ github.event.inputs.dry_run }}"

jobs:
  envset-deployment:
    name: "Deploy EnvSet ${{ github.event.inputs.envset_number }} (${{ github.event.inputs.environment }})"
    runs-on: [self-hosted, linux]
    timeout-minutes: 180

    steps:
      - name: "Checkout Automation Repository"
        uses: actions/checkout@v3

      - name: "Make Bash Scripts Executable"
        run: |
          chmod +x scripts/*.sh

      - name: "Mask Sensitive Credentials"
        run: |
          echo "::add-mask::${{ secrets.SSH_PASSWORD }}"
          echo "::add-mask::${{ secrets.SSH_PRIVATE_KEY }}"
          echo "::add-mask::${{ secrets.TEAMS_WEBHOOK_URL }}"

      - name: "Step 0: Resolve Server Mapping"
        run: |
          ./scripts/server_mapping.sh "${ENVIRONMENT}" "${ENVSET_NUMBER}"

      - name: "Step 1: Validate EnvSet Directory and Mandatory Packages"
        run: |
          ./scripts/validate_envset.sh

      - name: "Step 2: Enable Maintenance Mode"
        run: |
          ./scripts/maintenance_mode.sh "enable"

      - name: "Step 3: Update PCI2GA Version Configuration"
        run: |
          ./scripts/update_pci2ga_config.sh

      - name: "Step 4: Restart PCI2GA Service"
        run: |
          ./scripts/restart_pci2ga.sh

      - name: "Step 5: Process CVC Packages & Record Start Time"
        run: |
          ./scripts/process_cvc.sh

      - name: "Step 6: Monitor CVC Transformation (with Auto-Recovery)"
        run: |
          ./scripts/monitor_transformation.sh "CVC" 30

      - name: "Step 7: Process Remaining Packs (ART & ATS)"
        run: |
          ./scripts/process_remaining_packs.sh

      - name: "Step 8 & 9: Verify EnvFiles and Organize EnvSet Folder"
        run: |
          ./scripts/verify_envfiles.sh

      - name: "Step 10 & 11: Execute Sequential GA Import & Status Validation"
        run: |
          ./scripts/load_import_packs.sh "rest_api"

      - name: "Step 12: Calculate Total Deployment Duration"
        if: always()
        run: |
          ./scripts/calculate_duration.sh

      - name: "Step 2 Cleanup: Disable Maintenance Mode"
        if: always()
        run: |
          ./scripts/maintenance_mode.sh "disable" || true

      - name: "Step 13: Post Deployment Summary Notification"
        if: always()
        env:
          TEAMS_WEBHOOK_URL: "${{ secrets.TEAMS_WEBHOOK_URL }}"
        run: |
          STATUS="${{ job.status == 'success' && 'SUCCESS' || 'FAILED' }}"
          ./scripts/teams_notification.sh "$STATUS"

      - name: "Generate GitHub Step Summary Markdown"
        if: always()
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 EnvSet Deployment Summary
          | Parameter | Value |
          |---|---|
          | **EnvSet / ConfigSet Number** | `${ENVSET_NUMBER}` |
          | **Environment** | `${ENVIRONMENT}` |
          | **Dry-Run Mode** | `${DRY_RUN}` |

          ### 📋 Execution Summary
          All Linux Bash command execution steps completed successfully.
          EOF

      - name: "Upload Deployment State Artifacts"
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: "envset-deployment-artifacts-${{ github.event.inputs.envset_number }}"
          path: |
            .deployment_state.env
            config/environments.yaml
          retention-days: 30
